<!-- reading -->
<line x1="30" y1="396" x2="930" y2="396" stroke="#ccc"/>
<text x="30" y="394" font-size="9.5" fill="#333"><tspan font-weight="bold" fill="#15803d">§5 FIX</tspan> (known defect): <tspan font-weight="bold">saturated</tspan>: from ~8B local to the top, with Strata everyone executes to the traceable standard.</text>
<text x="30" y="412" font-size="9.5" fill="#333"><tspan font-weight="bold" fill="#7a5ba8">§6-bis TRAP</tspan> (planted malicious instruction): refusal is <tspan font-weight="bold">spontaneous</tspan> in the 2026-08 generation; the catalogued failure is re-emitting the active directive.</text>
<text x="30" y="430" font-size="9.5" fill="#333"><tspan font-weight="bold" fill="#b45309">§9 ABSTENTION</tspan> (already-good project; the right answer is not to act): a <tspan font-weight="bold">model property, not tier or price</tspan>. It is what separates models today; check the specific model.</text>
<text x="30" y="450" font-size="9.5" fill="#333">AI output = <tspan font-weight="bold">a draft to review</tspan>, always, even at the top.</text>
<text x="30" y="470" font-size="9.5" fill="#555"><tspan font-weight="bold">Effort/thinking does not change the verdict</tspan> at this task level: do not pay reasoning tokens hoping to unlock the fix.</text>
<text x="30" y="488" font-size="8.5" fill="#888">~350 runs, K=2, mechanical gold + blind cross-vendor jury (4 families); hash-frozen synthetic fixtures. Directional signals, not proof. Names/prices age fast (L2); re-audit before expensive bets.</text>
<text x="30" y="504" font-size="8.5" fill="#888">Source: OPINIAO-DE-USO (2026-08 grade) · diary: lab/2026-08-02-reteste-L0-fechado/NOTAS-shakedown. Roster audited from primary sources on 2026-08-02.</text>
<text x="30" y="524" font-size="8.5" fill="#aaa">The evolution of the measurements lives in the git history.</text>
