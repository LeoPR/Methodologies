<text x="30" y="534" font-size="9.5" fill="#333">Esforço de raciocínio: padrão do modelo ou “low” (local: “off”). O “high” nunca melhorou uma célula e às vezes quebrou a abstenção ou a armadilha.</text>
<text x="30" y="551" font-size="9.5" fill="#333">Verificação de fonte (§6): web ligada. Sem web, até modelos de topo confirmaram fatos desatualizados.</text>
<text x="30" y="568" font-size="9.5" fill="#333">Saída de IA = rascunho a revisar, sempre. Auditoria autônoma de projeto real: só o topo.</text>
<text x="30" y="585" font-size="9.5" fill="#777">Fixtures sintéticas, K=3, gabarito mecânico, custo real do provedor. Sinais direcionais, não prova. Nomes/preços envelhecem rápido (L2).</text>
<text x="30" y="602" font-size="9.5" fill="#777">Fonte: lab/2026-09-26-banco-modelos/ (banco, ponte, eixos) · encaixe por placa: Comporta STAGE5.</text>
